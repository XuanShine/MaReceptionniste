{% from "macros.html" import badge with context %}
<header id="fiche-entete" class="flex items-center gap-4 border-b border-slate-200 px-6 py-4" {% if oob|default(false) %}hx-swap-oob="outerHTML"{% endif %}>
  <div class="min-w-0">
    <div class="flex items-center gap-3">
      <h2 class="text-2xl font-semibold leading-tight">{{ fiche.client.nom_complet }}</h2>
      {{ badge(statut.libelle, statut.couleur) }}
    </div>
    <p class="text-sm text-ardoise">{{ sous_titre }}</p>
  </div>
  <span class="flex-1"></span>
  <button type="button" class="btn btn-flat" hx-post="/reservations/{{ fiche.id }}/abandon" hx-include="#fiche-champs" hx-swap="none">
    <span class="material-icons text-[1.1rem]">arrow_back</span>
    Planning
  </button>
</header>
