<p class="text-sm tracking-wide">Ma réceptionniste</p>
<h1 class="mt-6 text-xl font-medium">Connexion</h1>
<form class="mt-8 space-y-4" method="post" action="/login" hx-post="/login" hx-target="#ecran" hx-swap="innerHTML">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="redirect_to" value="{{ redirect_to }}">
  {% if erreur %}<p class="text-sm text-danger">{{ erreur }}</p>{% endif %}
  <label class="libelle">Email
    <input class="champ" name="email" type="email" autocomplete="username" value="{{ email }}" required>
  </label>
  <label class="libelle">Mot de passe
    <input class="champ" name="password" type="password" autocomplete="current-password" required>
  </label>
  <button class="btn w-full" type="submit">Se connecter</button>
</form>
<p class="mt-6 text-sm text-mute"><a class="lien" href="/register">Créer un compte</a></p>
