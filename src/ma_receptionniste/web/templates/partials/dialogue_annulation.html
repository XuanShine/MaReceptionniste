<dialog id="confirm-annulation" class="w-[28rem]" {% if oob|default(false) %}hx-swap-oob="outerHTML"{% endif %}>
  <h2 class="text-base font-semibold">Annuler la réservation ?</h2>
  <p class="mt-2 text-sm text-ardoise">Elle passe au statut « Annulée » et ses chambres sont libérées sur le planning.</p>
  <form class="mt-4 flex justify-end gap-2" method="post" action="/reservations/{{ fiche.id }}/annuler" hx-post="/reservations/{{ fiche.id }}/annuler" hx-swap="none">
    <button type="button" class="btn btn-flat" onclick="this.closest('dialog').close()">Retour</button>
    <button type="submit" class="btn btn-danger">Annuler la réservation</button>
  </form>
</dialog>
