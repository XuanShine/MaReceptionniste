<h1 class="text-xl font-medium">Chambres</h1>
<form class="mt-8 flex flex-wrap items-end gap-3" method="post" action="/chambres" hx-post="/chambres" hx-target="#panneau" hx-swap="innerHTML">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="libelle w-56">Nom
    <input class="champ" name="nom" value="{{ nom }}" maxlength="200" required>
  </label>
  <label class="libelle w-28">Position
    <input class="champ" name="position" type="number" min="0" step="1" value="{{ position }}" required>
  </label>
  <button class="btn" type="submit">Ajouter</button>
</form>
{% if erreur %}<p class="mt-4 text-sm text-danger">{{ erreur }}</p>{% endif %}
{% if not chambres %}
  <p class="mt-10 text-sm text-mute">Aucune chambre.</p>
{% else %}
  <ul class="mt-10 divide-y divide-line border-y border-line">
    {% for chambre in chambres %}
      {% include "_chambre_ligne.html" %}
    {% endfor %}
  </ul>
{% endif %}
