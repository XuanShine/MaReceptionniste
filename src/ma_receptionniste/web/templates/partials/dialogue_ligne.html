{% from "macros.html" import boite with context %}
{% call boite("w-[34rem]") %}
<h2 class="text-base font-semibold">Ligne de séjour · chambre {{ ligne.chambre_nom }}</h2>
<form id="form-edition" class="mt-4 flex flex-col gap-3" method="post" action="/reservations/{{ fiche.id }}/lignes/{{ ligne.id }}" hx-post="/reservations/{{ fiche.id }}/lignes/{{ ligne.id }}" hx-swap="none">
  <div hx-get="/reservations/{{ fiche.id }}/lignes/apercu?cible=dialogue" hx-trigger="input delay:200ms from:find input, change from:find select" hx-include="#form-edition" hx-swap="none">
    <label class="flex flex-col gap-1 text-sm">Chambre
      <select class="champ" name="chambre_id">
        {% for chambre in chambres %}
        <option value="{{ chambre.id }}" {% if chambre.id == ligne.chambre_id %}selected{% endif %}>{{ chambre.nom }}{% if chambre.type_chambre %} · {{ chambre.type_chambre }}{% endif %}</option>
        {% endfor %}
      </select>
    </label>
    <div class="mt-3 grid grid-cols-2 gap-3">
      <label class="flex flex-col gap-1 text-sm">Arrivée<input id="ligne-arrivee" class="champ" name="date_debut" type="date" value="{{ ligne.date_debut.isoformat() }}"></label>
      <label class="flex flex-col gap-1 text-sm">Départ<input id="ligne-depart" class="champ" name="date_fin" type="date" value="{{ ligne.date_fin.isoformat() }}"></label>
      <label class="flex flex-col gap-1 text-sm">Adultes<input class="champ" name="adultes" type="number" min="0" step="1" value="{{ ligne.adultes }}"></label>
      <label class="flex flex-col gap-1 text-sm">Enfants<input class="champ" name="enfants" type="number" min="0" step="1" value="{{ ligne.enfants }}"></label>
      <label class="flex flex-col gap-1 text-sm">Prix TTC/nuit<input class="champ" name="prix" type="number" min="0" step="0.01" value="{{ ligne.prix_nuit_centimes|saisie }}"></label>
      <label class="flex flex-col gap-1 text-sm">Remise<input class="champ" name="remise" type="number" min="0" max="100" step="1" value="{{ ligne.remise_pct }}"></label>
    </div>
    <label class="mt-3 flex flex-col gap-1 text-sm">Nom sur le séjour, si différent du client
      <input class="champ" name="nom_client" value="{{ ligne.nom_client or '' }}">
    </label>
    <p id="apercu-phrase" class="mt-3 text-sm tabular-nums text-ardoise">{{ apercu.phrase }}</p>
  </div>
  {% if confirmer %}<input type="hidden" name="confirmer" value="1">{% endif %}
  <div class="flex items-center gap-2 pt-1">
    <button class="btn btn-flat text-negative" type="submit" name="action" value="supprimer">{{ "Confirmer la suppression" if confirmer else "Supprimer la ligne" }}</button>
    <span class="flex-1"></span>
    <button type="button" class="btn btn-flat" onclick="document.getElementById('dialogue').replaceChildren()">Annuler</button>
    <button class="btn btn-primary" type="submit" name="action" value="enregistrer">Enregistrer</button>
  </div>
</form>
{% endcall %}
