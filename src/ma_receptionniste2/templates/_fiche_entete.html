<div class="flex flex-wrap items-center justify-between gap-4">
  <div>
    <h1 class="text-xl font-medium">{{ fiche.client }}</h1>
    <p class="mt-1 text-sm text-mute">{{ fiche.statut_label }}</p>
  </div>
  {% if not fiche.annulee %}
    <form method="post" action="/reservations/{{ fiche.id }}/annuler" hx-post="/reservations/{{ fiche.id }}/annuler" hx-target="#fiche" hx-swap="outerHTML" hx-confirm="Annuler cette réservation ?">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="btn-danger" type="submit">Annuler la réservation</button>
    </form>
  {% endif %}
</div>
